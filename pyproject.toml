[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scipion-app"
dynamic = ["version", "dependencies"]

authors = [
    {name = "Yunior Fonseca", email = "cfonseca@cnb.csic.es"},
    {name = "Pablo Conesa", email = "pconesa@cnb.csic.es"},
]
description = "Scipion application. Plugin manager"
readme = "README.rst"
requires-python = ">=3.8"
keywords = ["scipion", "electron-microscopy", "cryo-em", "structural-biology", "image-processing", "scipion-3.0"]
license = {text = "GNU General Public License v3 (GPLv3)"}

[project.urls]
Homepage = "https://github.com/scipion-em/scipion-app"
Repository = "https://github.com/scipion-em/scipion-app"
Issues = "https://github.com/scipion-em/scipion-app/issues"

[tool.setuptools.packages.find]
include = ["scipion", "scipion.*"]
exclude = ["scipion_home*", "tests*"]
namespaces = false

[tool.setuptools.package-data]
"scipion" = ["templates/*.template", "templates/*.json"]

[project.entry-points."pyworkflow.guiplugin"]
guiplugin = "scipion.guiplugin"

[project.scripts]
scipion = "scipion.__main__:main"

[tool.setuptools.dynamic]
version = {attr = "scipion.__version__"}
dependencies = {file = ["requirements.txt"]}

[project.optional-dependencies]
test = [
    "pytest==8.3.5; python_version < '3.9'",
    "pytest==8.4.2; python_version == '3.9'",
    "pytest==9.1.1; python_version >= '3.10'",
    "pytest-cov==5.0.0; python_version < '3.9'",
    "pytest-cov==7.1.0; python_version >= '3.9'",
]

[tool.pytest.ini_options]
testpaths = ["scipion/tests"]